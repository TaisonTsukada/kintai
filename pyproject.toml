[project]
name = "kintai"
version = "0.1.0"
description = "勤怠管理CLIツール"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TaisonTsukada" }]
dependencies = [
    "click>=8.0.0",
    "pytz>=2021.3",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
    "pyperclip>=1.8.0",
]

[project.urls]
Repository = "https://github.com/taison-tsukada/kintai"

[project.scripts]
kintai = "kintai:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
